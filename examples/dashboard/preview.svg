<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Apple-inspired usage dashboard preview</title>
  <desc id="desc">A calm dashboard with sidebar navigation, three metrics, a trend chart, filters, and a provider table.</desc>
  <rect width="1200" height="760" rx="24" fill="#f5f5f7"/>
  <rect x="24" y="24" width="1152" height="712" rx="20" fill="#ffffff" stroke="#d9d9de"/>
  <rect x="24" y="24" width="210" height="712" rx="20" fill="#fbfbfd"/>
  <text x="58" y="78" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1d1d1f">Acme Usage</text>
  <rect x="48" y="110" width="160" height="38" rx="10" fill="#e8f1fb"/>
  <text x="68" y="135" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1d1d1f">Overview</text>
  <text x="68" y="184" font-family="Arial, sans-serif" font-size="15" fill="#6e6e73">Requests</text>
  <text x="68" y="225" font-family="Arial, sans-serif" font-size="15" fill="#6e6e73">Costs</text>
  <text x="68" y="266" font-family="Arial, sans-serif" font-size="15" fill="#6e6e73">Settings</text>
  <text x="278" y="80" font-family="Arial, sans-serif" font-size="14" fill="#6e6e73">Workspace · Production</text>
  <text x="278" y="125" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#1d1d1f">Usage overview</text>
  <rect x="850" y="96" width="132" height="42" rx="10" fill="#ffffff" stroke="#d9d9de"/>
  <text x="872" y="122" font-family="Arial, sans-serif" font-size="14" fill="#1d1d1f">Last 30 days</text>
  <rect x="994" y="96" width="92" height="42" rx="10" fill="#ffffff" stroke="#d9d9de"/>
  <text x="1015" y="122" font-family="Arial, sans-serif" font-size="14" fill="#1d1d1f">Export</text>
  <g>
    <rect x="278" y="166" width="280" height="118" rx="16" fill="#ffffff" stroke="#d9d9de"/>
    <text x="302" y="198" font-family="Arial, sans-serif" font-size="14" fill="#6e6e73">Requests</text>
    <text x="302" y="240" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#1d1d1f">12.8M</text>
    <text x="302" y="263" font-family="Arial, sans-serif" font-size="13" fill="#248a3d">↑ 8.4% vs prior period</text>
    <rect x="576" y="166" width="280" height="118" rx="16" fill="#ffffff" stroke="#d9d9de"/>
    <text x="600" y="198" font-family="Arial, sans-serif" font-size="14" fill="#6e6e73">Spend</text>
    <text x="600" y="240" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#1d1d1f">$128.32</text>
    <text x="600" y="263" font-family="Arial, sans-serif" font-size="13" fill="#248a3d">↓ 4.1% vs prior period</text>
    <rect x="874" y="166" width="212" height="118" rx="16" fill="#ffffff" stroke="#d9d9de"/>
    <text x="898" y="198" font-family="Arial, sans-serif" font-size="14" fill="#6e6e73">Success rate</text>
    <text x="898" y="240" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#1d1d1f">99.94%</text>
    <text x="898" y="263" font-family="Arial, sans-serif" font-size="13" fill="#248a3d">↑ 0.12 pts</text>
  </g>
  <rect x="278" y="312" width="808" height="188" rx="16" fill="#ffffff" stroke="#d9d9de"/>
  <text x="302" y="348" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d1d1f">Requests over time</text>
  <text x="302" y="372" font-family="Arial, sans-serif" font-size="13" fill="#6e6e73">Daily total · UTC</text>
  <g fill="#8bbcf0">
    <rect x="340" y="450" width="28" height="22" rx="5"/><rect x="395" y="438" width="28" height="34" rx="5"/><rect x="450" y="426" width="28" height="46" rx="5"/><rect x="505" y="414" width="28" height="58" rx="5"/><rect x="560" y="396" width="28" height="76" rx="5"/><rect x="615" y="382" width="28" height="90" rx="5"/><rect x="670" y="422" width="28" height="50" rx="5"/><rect x="725" y="407" width="28" height="65" rx="5"/><rect x="780" y="394" width="28" height="78" rx="5"/><rect x="835" y="378" width="28" height="94" rx="5"/><rect x="890" y="364" width="28" height="108" rx="5"/><rect x="945" y="346" width="28" height="126" rx="5" fill="#0071e3"/>
  </g>
  <line x1="320" y1="472" x2="1034" y2="472" stroke="#d9d9de"/>
  <text x="302" y="530" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d1d1f">By provider</text>
  <text x="984" y="530" font-family="Arial, sans-serif" font-size="13" fill="#6e6e73">Exact values</text>
  <line x1="302" y1="554" x2="1062" y2="554" stroke="#d9d9de"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#6e6e73">
    <text x="302" y="580">Provider</text><text x="650" y="580">Requests</text><text x="808" y="580">Spend</text><text x="970" y="580">Success</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#1d1d1f">
    <text x="302" y="616">OpenAI</text><text x="650" y="616">8.1M</text><text x="808" y="616">$84.12</text><text x="970" y="616">99.96%</text>
    <text x="302" y="654">DeepSeek</text><text x="650" y="654">3.2M</text><text x="808" y="654">$28.76</text><text x="970" y="654">99.91%</text>
    <text x="302" y="692">GLM</text><text x="650" y="692">1.5M</text><text x="808" y="692">$15.44</text><text x="970" y="692">99.88%</text>
  </g>
